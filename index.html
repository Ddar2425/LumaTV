<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Luma TV</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#" aria-label="Luma home">luma<span>TV</span></a><nav aria-label="Main navigation"><button data-page="home" class="active">Home</button><button data-page="apps">Apps</button><button data-page="library">Library</button><button data-page="updates">Updates</button></nav><div class="status"><span id="controller">PC MODE</span><time id="clock"></time><button data-page="settings" aria-label="Settings">⚙</button></div></header>
<main id="main"></main><footer><span><b>↑ ↓ ← →</b> Move <b>Enter / A</b> Select <b>Esc / B</b> Back</span><span>F11 Fullscreen · Esc Return home from a service</span></footer>
<section id="service-bar" hidden aria-label="In-app controls"><button id="service-home">⌂ Home</button><button id="service-back">← Back</button><button id="service-reload">↻ Reload</button><div><strong id="service-name"></strong><span id="service-status" role="status"></span></div><small>Esc / Alt+Home returns to Luma</small></section>
<dialog id="web-dialog"><form id="web-form"><span class="eyebrow">MAKE IT YOURS</span><h2>Add a website</h2><label>Name<input id="web-name" maxlength="32" required placeholder="e.g. Plex"></label><label>Website address<input id="web-url" type="url" required placeholder="https://…"></label><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Add shortcut</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="renderer.js"></script></body></html>
